name: Build XCSABER TV OS from zip
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q xcsaber-tv-os.zip -d src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Unit tests
        working-directory: src/xcsaber-tv-os/launcher
        run: gradle --no-daemon testDebugUnitTest
      - name: Build APK
        working-directory: src/xcsaber-tv-os/launcher
        run: gradle --no-daemon assembleDebug
      - name: Checksum
        run: |
          mkdir dist
          cp src/xcsaber-tv-os/launcher/app/build/outputs/apk/debug/app-debug.apk dist/xcsaber-tv-os-debug.apk
          cd dist && sha256sum xcsaber-tv-os-debug.apk | tee SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: xcsaber-tv-os-debug
          path: dist/*
